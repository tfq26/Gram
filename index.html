<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gram" />
  <title>Gram</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0c;
      color: #ffffff;
    }
    @keyframes gramBootSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .gram-boot-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      color: #ffffff;
      z-index: 9999;
    }
    .gram-boot-logo {
      width: 44px;
      height: 44px;
      animation: gramBootSpin 1.35s linear infinite;
    }
    @media (prefers-color-scheme: light) {
      html, body, .gram-boot-screen {
        background: #f6f6f7;
        color: #111113;
      }
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/gram-logo.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/shadcn.css" />
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/v2-adapter.css" />
</head>
<body>
  <div id="root"></div>
  <div id="gram-preboot" class="gram-boot-screen" role="status" aria-label="Loading Gram">
    <svg class="gram-boot-logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="gram-preboot-p1" x1="18" y1="8" x2="54" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#34D399" />
          <stop offset="100%" stop-color="#0EA5E9" />
        </linearGradient>
        <linearGradient id="gram-preboot-p2" x1="18" y1="8" x2="54" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#A78BFA" />
          <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
        <linearGradient id="gram-preboot-p3" x1="18" y1="8" x2="54" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FBBF24" />
          <stop offset="100%" stop-color="#FB7185" />
        </linearGradient>
      </defs>
      <g transform="translate(32 32) scale(1.18) translate(-32 -32)">
        <g transform="rotate(0 32 32)">
          <path fill="url(#gram-preboot-p1)" d="M32.5 8.5c12.4 0 21 8.8 21 20.6 0 1.6-1.6 2.6-3 1.8-4.2-2.3-7.4-5.4-9.8-9.3-2.5-4-6-6.2-10.2-6.2-2.9 0-5.4.8-7.4 2.2-1.3.9-2.8-.4-2.1-1.8C23.1 11.4 27.4 8.5 32.5 8.5z" />
        </g>
        <g transform="rotate(120 32 32)">
          <path fill="url(#gram-preboot-p2)" d="M32.5 8.5c12.4 0 21 8.8 21 20.6 0 1.6-1.6 2.6-3 1.8-4.2-2.3-7.4-5.4-9.8-9.3-2.5-4-6-6.2-10.2-6.2-2.9 0-5.4.8-7.4 2.2-1.3.9-2.8-.4-2.1-1.8C23.1 11.4 27.4 8.5 32.5 8.5z" />
        </g>
        <g transform="rotate(240 32 32)">
          <path fill="url(#gram-preboot-p3)" d="M32.5 8.5c12.4 0 21 8.8 21 20.6 0 1.6-1.6 2.6-3 1.8-4.2-2.3-7.4-5.4-9.8-9.3-2.5-4-6-6.2-10.2-6.2-2.9 0-5.4.8-7.4 2.2-1.3.9-2.8-.4-2.1-1.8C23.1 11.4 27.4 8.5 32.5 8.5z" />
        </g>
      </g>
    </svg>
  </div>
  <script type="module" src="/src/ui/main.tsx"></script>
</body>
</html>
