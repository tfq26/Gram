[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-terminal"
version = "0.1.0"
description = "A lightweight reactive voice coding assistant for PowerShell"
requires-python = ">=3.11"

[project.scripts]
gram = "gram.app:main"

[tool.setuptools.packages.find]
include = ["gram*"]
